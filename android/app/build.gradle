apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.suikamovie.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.suikamovie.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Java & Kotlin harus dikompilasi ke JVM target yang sama, kalau nggak
    // Gradle bakal error "Inconsistent JVM-target compatibility detected".
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        // Versi Compose Compiler ini yang cocok/kompatibel sama Kotlin 1.9.24
        // (lihat android/build.gradle -> ext.kotlin_version).
        kotlinCompilerExtensionVersion "1.5.14"
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'suikamovie123'
            keyAlias 'suikamovie'
            keyPassword 'suikamovie123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    // .await() buat Task<T> (Firebase Auth/Firestore pake Task, bukan suspend fun asli)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"

    // AppCompat masih dipakai buat resolve style Theme.AppCompat.* di
    // styles.xml (dipakai activity theme sebelum Compose ambil alih layar).
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"

    // ---- Jetpack Compose ----
    implementation platform("androidx.compose:compose-bom:2024.09.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.navigation:navigation-compose:2.8.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.6"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // ---- Splash screen (dipakai oleh style AppTheme.NoActionBarLaunch) ----
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // ---- Loading gambar poster/backdrop (pengganti <img> di HTML dulu) ----
    implementation "io.coil-kt:coil-compose:2.7.0"

    // ---- Networking ke TMDB (pengganti fetch() di app.js dulu) ----
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // ---- Penyimpanan lokal (pengganti localStorage dulu): riwayat
    //      pencarian, favorit, riwayat nonton, setting auto-rotate ----
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // ---- Firebase native (pengganti Firebase JS SDK yang dulu jalan di WebView) ----
    implementation platform("com.google.firebase:firebase-bom:34.18.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-analytics"

    // ---- Google Sign-In native (Credential Manager - API modern penerus
    //      GoogleSignInClient yang lama) ----
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.09.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
